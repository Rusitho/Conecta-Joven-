name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - claude/publish-html-6hsm2m
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite un unico despliegue concurrente sin cancelar los que esten en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Configurar y activar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
